# Only application-specific data; implementation is shared across all clients.
schema_version = 1

[app]
name = "Megalodonte Video Editor"
version = "0.1.0"
main_class = "megalodonte.script.ScriptLauncher"

[build]
mode = "distribution"
tasks = ["installDist"]
jar = "build/install/megalodonte-video-editor/lib/megalodonte-video-editor-{version}.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.sql", "jdk.zipfs", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["jfxwebkit.dll"]

[windows]
upgrade_uuid = "76ab25ab-c55f-42c3-aeb8-b1777eb60d42"
per_user = true

[linux]
package_name = "megalodonte-video-editor"
menu_group = "Office"
